name: Authenticate Terraform Providers
description: Authenticates Terraform providers

inputs:
  aws-region:
    description: AWS region
    required: false
    default: us-east-1
  dir:
    description: Terraform stack directory (used to detect the Grafana provider)
    required: false
    default: "."
  fgr-version:
    description: "@figurepos/platform-tooling version used to mint Grafana tokens"
    required: false
    default: "2.4.0"
  providers:
    description: "Comma separated list of providers to authenticate"
    required: false
  service-name:
    description: The service name
    required: true

runs:
  using: composite
  steps:
    - name: Assume AWS Role in Root Account Using OIDC
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: arn:aws:iam::637192944017:role/${{ inputs.service-name }}__oidc
        role-skip-session-tagging: true
    - name: Set Variables From SSM
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        echo "Fetching SSM parameters..."
        PARAMS=$(aws ssm get-parameters-by-path \
          --path "/terraform/" \
          --recursive \
          --with-decryption \
          --region "$AWS_REGION" \
          --query 'Parameters[*].[Name,Value]' \
          --output text)

        while IFS=$'\t' read -r name value; do
          # Convert SSM path to environment variable name (lowercase)
          var_name=$(echo "$name" | sed 's|/terraform/||' | tr '/' '_')
          
          # Add TF_VAR_ prefix for Terraform variables
          var_name="TF_VAR_${var_name}"
          
          echo "Variable $var_name set."
          echo "::add-mask::$value"
          echo "$var_name=$value" >> "$GITHUB_ENV"
        done <<< "$PARAMS"

    - name: Detect Grafana Terraform auth
      id: grafana
      shell: bash
      env:
        PROVIDERS: ${{ inputs.providers }}
        STACK_DIR: ${{ inputs.dir }}
      run: |
        mint=false
        if echo ",${PROVIDERS}," | tr -d ' ' | grep -qi ',grafana,'; then
          mint=true
        elif compgen -G "${STACK_DIR}/*.tf" > /dev/null && grep -qE 'grafana/grafana|provider[[:space:]]+"grafana"' "${STACK_DIR}"/*.tf; then
          mint=true
        fi
        if [ -n "${TF_VAR_grafana_auth:-}" ] && [ -n "${TF_VAR_grafana_url:-}" ]; then
          mint=false
        fi
        echo "mint=${mint}" >> "$GITHUB_OUTPUT"

    - name: Set Up Node.js
      if: steps.grafana.outputs.mint == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://npm.pkg.github.com
        scope: "@figurepos"

    - name: Install fgr
      if: steps.grafana.outputs.mint == 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: npm install --global "@figurepos/platform-tooling@${{ inputs.fgr-version }}"

    - name: Mint Grafana Terraform token
      if: steps.grafana.outputs.mint == 'true'
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        PROVIDERS: ${{ inputs.providers }}
        STACK_DIR: ${{ inputs.dir }}
      run: |
        force_args=()
        if echo ",${PROVIDERS}," | tr -d ' ' | grep -qi ',grafana,'; then
          force_args+=(--force)
        fi

        session=$(fgr tf grafana-auth mint --dir "${STACK_DIR}" --region "${AWS_REGION}" "${force_args[@]}")
        if echo "$session" | jq -e '.skipped == true' >/dev/null; then
          echo "Grafana mint skipped ($(echo "$session" | jq -r '.reason'))"
          exit 0
        fi

        auth=$(echo "$session" | jq -r '.auth')
        url=$(echo "$session" | jq -r '.url')
        workspace_id=$(echo "$session" | jq -r '.workspaceId')
        service_account_id=$(echo "$session" | jq -r '.serviceAccountId')
        token_id=$(echo "$session" | jq -r '.tokenId')

        if [ -z "$auth" ] || [ "$auth" = "null" ] || [ -z "$token_id" ] || [ "$token_id" = "null" ]; then
          echo "fgr tf grafana-auth mint did not return a token"
          echo "$session"
          exit 1
        fi

        echo "::add-mask::${auth}"
        {
          echo "TF_VAR_grafana_url=${url}"
          echo "TF_VAR_grafana_auth=${auth}"
          echo "GRAFANA_TF_AUTH_WORKSPACE_ID=${workspace_id}"
          echo "GRAFANA_TF_AUTH_SERVICE_ACCOUNT_ID=${service_account_id}"
          echo "GRAFANA_TF_AUTH_TOKEN_ID=${token_id}"
        } >> "$GITHUB_ENV"
        echo "Grafana provider auth set for ${url}"
