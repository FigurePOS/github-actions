name: Terraform Deploy
description: Deploys the Terraform code

inputs:
  artifact-path:
    description: Path to download artifact from
    required: false
  auth-providers:
    description: Providers to authenticate
    required: false
  aws-account-id:
    description: AWS account ID
    required: true
  aws-region:
    description: AWS region
    required: false
    default: us-east-1
  backend-s3-key:
    description: The S3 key for the backend
    required: false
  db-tunnel-mapping:
    description: DB tunnel mapping
    required: false
    default: ""
  dir:
    required: false
    default: tf
  env:
    description: The environment
    required: true
  github-token-terraform:
    description: GitHub token to access other private repositories
    required: false
  pnpm-version:
    description: pnpm version to use
    required: false
    default: "11.20.0"
  service-name:
    description: The service name
    required: true
  sha:
    description: Release commit SHA
    required: false
  ssm-parameters:
    description: The SSM parameters to set as environment variables in format "env_var_name1=ssm_path1,env_var_name2=ssm_path2"
    required: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.sha != '' && inputs.sha || github.sha }}

    - name: Create Deployment
      id: create_deployment
      uses: FigurePOS/github-actions/.github/actions/github-deployment-create@v6
      with:
        environment: ${{ inputs.env }}
        ref: ${{ github.sha }}
        description: Deploy

    - name: Set Up Node.js
      if: ${{ hashFiles('package.json') != '' }}
      uses: FigurePOS/github-actions/.github/actions/node-setup@v6
      with:
        pnpm-version: ${{ inputs.pnpm-version }}

    # Install so aws-lambda-function local-exec can reuse node_modules/.bin/fgr
    # (version from the service lockfile) instead of unversioned npx.
    - name: Install Dependencies
      if: ${{ hashFiles('package.json') != '' }}
      uses: FigurePOS/github-actions/.github/actions/node-pnpm-install@v6

    - name: Download Artifact
      if: inputs.artifact-path != ''
      uses: actions/download-artifact@v8
      with:
        path: ${{ inputs.artifact-path }}

    - name: Set Env Vars From SSM Parameters
      if: inputs.ssm-parameters != ''
      uses: FigurePOS/github-actions/.github/actions/set-env-vars-from-ssm-parameters@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        parameters: ${{ inputs.ssm-parameters }}
        service-name: ${{ inputs.service-name }}

    - name: Authenticate Terraform Providers
      uses: FigurePOS/github-actions/.github/actions/auth-terraform-providers@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        dir: ${{ inputs.dir }}
        providers: ${{ inputs.auth-providers }}
        service-name: ${{ inputs.service-name }}

    - name: Create SSH tunnel
      if: inputs.db-tunnel-mapping != ''
      id: create-ssh-tunnel
      uses: FigurePOS/github-actions/.github/actions/db-create-ssh-tunnel@v6
      with:
        aws-account-id: ${{ inputs.aws-account-id }}
        aws-region: ${{ inputs.aws-region }}
        db-tunnel-mapping: ${{ inputs.db-tunnel-mapping }}
        service-name: ${{ inputs.service-name }}

    - name: Terraform Init
      uses: FigurePOS/github-actions/.github/actions/terraform-init@v6
      with:
        aws-account-id: ${{ inputs.aws-account-id }}
        backend-s3-key: ${{ inputs.backend-s3-key }}
        dir: ${{ inputs.dir }}
        env: ${{ inputs.env }}
        github-token-terraform: ${{ inputs.github-token-terraform }}
        service-name: ${{ inputs.service-name }}
      env:
        AWS_REGION: ${{ inputs.aws-region }}

    # ponytail: avoid releasing terraform-modules — patch vendored lambda.tf to use
    # the fgr from the service lockfile instead of unversioned npx (wrong latest).
    - name: Point Lambda builds at local fgr
      if: ${{ hashFiles('package.json') != '' }}
      shell: bash
      run: |
        FGR="$(pwd)/node_modules/.bin/fgr"
        if [ ! -x "$FGR" ]; then
          echo "No local fgr at $FGR; leaving module npx command as-is"
          exit 0
        fi
        echo "Using $FGR"
        find "${{ inputs.dir }}/.terraform/modules" -name 'lambda.tf' -type f | while read -r f; do
          if grep -q 'npx --yes @figurepos/platform-tooling' "$f"; then
            echo "Patching $f"
            sed -i "s|npx --yes @figurepos/platform-tooling|${FGR}|g" "$f"
          fi
        done

    - name: Terraform Apply
      uses: FigurePOS/github-actions/.github/actions/terraform-apply@v6
      with:
        aws-account-id: ${{ inputs.aws-account-id }}
        dir: ${{ inputs.dir }}
        env: ${{ inputs.env }}
        service-name: ${{ inputs.service-name }}
        sha: ${{ inputs.sha }}
      env:
        AWS_REGION: ${{ inputs.aws-region }}

    - name: Cleanup Authenticated Terraform Providers
      if: always()
      uses: FigurePOS/github-actions/.github/actions/auth-terraform-providers-cleanup@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        providers: ${{ inputs.auth-providers }}
        service-name: ${{ inputs.service-name }}

    - name: Update Deployment Status - Success
      if: success() && steps.create_deployment.outputs.deployment-id != ''
      uses: FigurePOS/github-actions/.github/actions/github-deployment-status@v6
      with:
        deployment-id: ${{ steps.create_deployment.outputs.deployment-id }}
        state: success
        description: Terraform deployment completed successfully

    - name: Update Deployment Status - Failure
      if: failure() && steps.create_deployment.outputs.deployment-id != ''
      uses: FigurePOS/github-actions/.github/actions/github-deployment-status@v6
      with:
        deployment-id: ${{ steps.create_deployment.outputs.deployment-id }}
        state: failure
        description: Terraform deployment failed
