name: Node Test Lambda Functions
description: Runs the linters and tests for the Node.js lambda functions

inputs:
  directory:
    description: The directory containing the lambda functions
    required: false
    default: ./lambda
  npm-legacy-peer-deps:
    description: Whether to use legacy peer dependencies
    required: false
    default: false
  pnpm-version:
    description: pnpm version to use
    required: false
    default: "11.20.0"
  service-name:
    description: The service name
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set Up Node.js
      uses: FigurePOS/github-actions/.github/actions/node-setup@v6
      with:
        pnpm-version: ${{ inputs.pnpm-version }}

    - name: Install Dependencies
      uses: FigurePOS/github-actions/.github/actions/node-pnpm-install@v6
      with:
        directory: ${{ inputs.directory }}
        legacy-peer-deps: ${{ inputs.npm-legacy-peer-deps }}

    - name: Process Linters and Tests for Lambda Functions
      shell: bash
      run: |
        cd ${{ inputs.directory }}
        pnpm run ci:test
