name: CI Bugsnag Upload Source Maps (Node)
description: Builds a Node.js backend service and uploads source maps to Bugsnag

inputs:
  api-key:
    description: "Auth token for the Bugsnag API"
    required: true
  directory:
    description: "Directory containing compiled JS and .map files"
    required: false
    default: "build"
  npm-legacy-peer-deps:
    description: Whether to use legacy peer dependencies
    required: false
    default: "false"
  pnpm-version:
    description: pnpm version to use
    required: false
    default: "11.20.0"
  service-name:
    description: "Service name"
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set Up Node.js
      uses: FigurePOS/github-actions/.github/actions/node-setup@v6
      with:
        pnpm-version: ${{ inputs.pnpm-version }}

    - name: Install Dependencies
      uses: FigurePOS/github-actions/.github/actions/node-pnpm-install@v6
      with:
        legacy-peer-deps: ${{ inputs.npm-legacy-peer-deps }}

    - name: Check for SDK Directory
      id: check-sdk
      shell: bash
      run: |
        if [ -d "./sdk" ] && [ -f "./sdk/package.json" ]; then
          echo "sdk-exists=true" >> $GITHUB_OUTPUT
        else
          echo "sdk-exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Install SDK Dependencies
      if: steps.check-sdk.outputs.sdk-exists == 'true'
      uses: FigurePOS/github-actions/.github/actions/node-pnpm-install@v6
      with:
        directory: ./sdk
        legacy-peer-deps: ${{ inputs.npm-legacy-peer-deps }}

    - name: Build
      shell: bash
      run: pnpm run ci:build

    - name: Resolve App Version
      id: version
      shell: bash
      # Must match lib-observability BugSnag appVersion (OTEL_SERVICE_VERSION = ECS deployment_tag).
      run: echo "app_version=$(git rev-parse --short=8 ${{ github.sha }})" >> $GITHUB_OUTPUT

    - name: Upload Source Maps to Bugsnag
      uses: FigurePOS/github-actions/.github/actions/bugsnag-upload-source-maps-node@v6
      with:
        api-key: ${{ inputs.api-key }}
        directory: ${{ inputs.directory }}
        version: ${{ steps.version.outputs.app_version }}
