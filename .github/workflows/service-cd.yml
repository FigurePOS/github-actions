name: Production Deployment
on:
  workflow_call:
    inputs:
      aws-account-id:
        description: AWS account ID
        required: false
        type: string
        default: "682919404744"
      aws-region:
        description: AWS region
        required: false
        type: string
        default: us-east-1
      db-tunnel-mapping:
        description: DB tunnel mapping
        required: false
        type: string
        default: ""
      pnpm-version:
        description: "Optional exact pnpm override. Default: package.json packageManager."
        required: false
        type: string
        default: ""
      service-name:
        description: Service name
        required: true
        type: string
      sha:
        description: Release commit SHA
        required: true
        type: string
      use-github-runners:
        description: "Use GitHub-hosted runners instead of blacksmith runners"
        required: false
        type: boolean
        default: false
    secrets:
      BUDDY_TRIGGER_URL:
        description: Buddy trigger URL
      GH_TOKEN_TERRAFORM:
        description: GitHub token to access other private repositories
        required: false

permissions:
  # Needed to checkout repository code, read repository contents and create tags
  contents: write
  # Required for OIDC authentication with AWS
  id-token: write
  # Allows reading from GitHub container registry (ghcr.io)
  packages: read
  # Allows creating and updating Deployments
  deployments: write

# Queue a second production release instead of cancelling the one already applying.
concurrency:
  group: service-cd-${{ inputs.service-name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify forward-only production release
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ inputs.sha }}
        with:
          script: |
            const sha = process.env.TARGET_SHA;
            if (!sha) {
              core.setFailed("Missing release SHA");
              return;
            }
            const { owner, repo } = context.repo;
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: sha });
            const fullSha = commit.data.sha;

            const onMaster = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${fullSha}...master`,
            });
            if (onMaster.data.status !== "ahead" && onMaster.data.status !== "identical") {
              core.setFailed(`${fullSha} is not on master (${onMaster.data.status})`);
              return;
            }

            let productionSha;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: "tags/production" });
              productionSha = ref.data.object.sha;
              if (ref.data.object.type === "tag") {
                const tag = await github.rest.git.getTag({ owner, repo, tag_sha: productionSha });
                productionSha = tag.data.object.sha;
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            if (!productionSha) {
              core.setFailed("Missing production tag");
              return;
            }

            const forward = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${productionSha}...${fullSha}`,
            });
            if (forward.data.status !== "ahead") {
              core.setFailed(`${fullSha} does not follow production tag ${productionSha} (${forward.data.status})`);
              return;
            }

            const deployments = await github.rest.repos.listDeployments({
              owner,
              repo,
              sha: fullSha,
              environment: "development",
              per_page: 30,
            });
            for (const deployment of deployments.data) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 20,
              });
              if (statuses.data.some((status) => status.state === "success")) {
                return;
              }
            }
            core.setFailed(`${fullSha} has no successful development deployment`);

  resolve-pnpm:
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - id: resolve
        uses: FigurePOS/github-actions/.github/actions/resolve-pnpm-version@v6
        with:
          pnpm-version: ${{ inputs.pnpm-version }}

  terraform-deploy:
    needs: [resolve-pnpm]
    runs-on: ${{ inputs.use-github-runners && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    env:
      AWS_REGION: ${{ inputs.aws-region }}
    steps:
      - uses: FigurePOS/github-actions/.github/actions/ci-terraform-apply@v6
        with:
          aws-account-id: ${{ inputs.aws-account-id }}
          aws-region: ${{ inputs.aws-region }}
          db-tunnel-mapping: ${{ inputs.db-tunnel-mapping }}
          env: production
          github-token-terraform: ${{ secrets.GH_TOKEN_TERRAFORM }}
          pnpm-version: ${{ needs.resolve-pnpm.outputs.version }}
          service-name: ${{ inputs.service-name }}
          sha: ${{ inputs.sha }}

      - name: Create a Release Tag and Update the Production Tag
        uses: FigurePOS/github-actions/.github/actions/github-tag-release@v6
        with:
          sha: ${{ inputs.sha }}
