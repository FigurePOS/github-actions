name: "Update mobile app OTA (over the air)"

on:
  workflow_call:
    inputs:
      author:
        description: "Author of the update"
        required: false
        type: string
      environment:
        description: "Environment"
        required: true
        type: string
        #options: development, production
      whitelabel:
        description: "Whitelabel (used for mobile ordering)"
        required: false
        type: string
        default: ""
      platform:
        description: "Platform"
        required: false
        default: "all"
        type: string
        # options: all, ios, android
      version:
        description: "Version"
        required: true
        type: string
      git-ref:
        description: "Git ref"
        required: false
        type: string
      should-notify:
        description: "Should send a notification to Buddy"
        required: false
        type: boolean
        default: true
      code-bundle-suffix:
        description: "Allows to add custom suffix to bundle id for source maps upload"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory"
        required: false
        type: string
        default: "./"
      node-version:
        description: "Node version"
        required: false
        type: string
        default: "22.x"
    secrets:
      BUDDY_SLACK_NOTIFIER_AUTH_TOKEN:
        description: "Buddy Slack Notifier Auth Token"
        required: true
      BUDDY_TRIGGER_URL:
        description: "Buddy trigger URL"
        required: true
      BUGSNAG_API_KEY:
        description: "Bugsnag API key"
        required: true
      EXPO_TOKEN:
        description: "EXPO token"
        required: true
      ENV_JSON:
        description: "Environment JSON"
        required: false

permissions:
  contents: read
  packages: read

jobs:
  version:
    name: "Update OTA"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      APP_VARIANT: ${{ inputs.environment }}
      WHITELABEL: ${{ inputs.whitelabel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git-ref || format('v{0}', inputs.version) }}
          # This makes sure there are two commits in the git history, needed for getting the previous commit message.
          fetch-depth: 2

      - name: Set Up Node.js
        uses: FigurePOS/github-actions/.github/actions/setup-node@v1
        with:
          version: ${{ inputs.node-version }}

      - name: Install Dependencies
        uses: FigurePOS/github-actions/.github/actions/install-dependencies@v1

      - name: Set Environment
        uses: FigurePOS/github-actions/.github/actions/mobile-set-env@v6
        with:
          env-json: ${{ secrets.ENV_JSON }}
          destination: ${{ inputs.working-directory }}/env.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Get Git Message
        id: get-git-message
        uses: FigurePOS/github-actions/.github/actions/git-get-message@v6
        with:
          commit-offset: 2

      - name: Get App Info
        uses: FigurePOS/github-actions/.github/actions/eas-get-app-info@v6
        id: get-app-info
        with:
          environment: ${{ inputs.environment }}
          platform: ${{ inputs.platform }}
          whitelabel: ${{ inputs.whitelabel }}
          working-directory: ${{ inputs.working-directory }}

      - name: Update OTA with Expo Updates
        env:
          GIT_MESSAGE: ${{ steps.get-git-message.outputs.message }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          message_git=${GIT_MESSAGE//\"/\\\"}
          message=$(printf "v%s: %s" "${{ inputs.version }}" "$message_git")
          echo "Running deployment for:"
          echo "  environment: '${{ inputs.environment }}'"
          echo "  platform: '${{ inputs.platform }}'"
          echo "  message: '$message'"
          echo "  author: '${{ inputs.author }}'"
          eas update --channel ${{ inputs.environment }} -p ${{ inputs.platform }} -m "$message" --non-interactive

      - name: Upload Source Maps to Bugsnag
        uses: FigurePOS/github-actions/.github/actions/bugsnag-upload-source-maps-mobile@v6
        with:
          api-key: ${{ secrets.BUGSNAG_API_KEY }}
          version: ${{ inputs.version }}
          platform: ${{ inputs.platform }}
          environment: ${{ inputs.environment }}
          code-bundle-suffix: ${{ inputs.code-bundle-suffix }}
          working-directory: ${{ inputs.working-directory }}

      - name: Describe Slack Notification
        id: slack
        if: ${{ inputs.should-notify }}
        env:
          GIT_MESSAGE: ${{ steps.get-git-message.outputs.message }}
          APP_NAME: ${{ steps.get-app-info.outputs.app-name }}
          HASH: ${{ steps.get-git-message.outputs.hash }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          short=$(printf '%s' "$HASH" | cut -c1-7)
          repository_name=$(printf '%s' "${{ github.repository }}" | cut -d'/' -f2)
          case "$ENVIRONMENT" in
            production)
              emoji="prod"
              ;;
            local|local-simulator)
              emoji="lcl"
              ;;
            *)
              emoji="dev"
              ;;
          esac
          {
            echo "emoji=${emoji}-available"
            echo "repository=${repository_name}"
            echo "title<<EOF"
            echo "Finished building *${APP_NAME} ${VERSION}* for _Expo_"
            echo "EOF"
            echo "text<<EOF"
            echo "Commit: *${GIT_MESSAGE}* (\`${short}\`)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        if: ${{ inputs.should-notify }}
        uses: FigurePOS/github-actions/.github/actions/buddy-slack-notify@v6
        with:
          token: ${{ secrets.BUDDY_SLACK_NOTIFIER_AUTH_TOKEN }}
          channel: figure-buddy
          emoji: ${{ steps.slack.outputs.emoji }}
          title: ${{ steps.slack.outputs.title }}
          text: ${{ steps.slack.outputs.text }}
          repository: ${{ steps.slack.outputs.repository }}
          author: ${{ inputs.author }}
